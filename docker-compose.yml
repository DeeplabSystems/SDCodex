# SDCodex — Docker Compose (Modular Plugin Architecture)
#
# Core SDCodex provides Home, Models, and Library.
# Additional capabilities (Captioning/Gallery/ComfyUI, GalleryDL, RemBG)
# are installed as plugins via Settings -> Plugins.
#
# Installing a plugin updates the volume mounts below, requirements.txt, and .env.
# After installing or reconfiguring a plugin, restart with:
#   docker compose up -d

services:
  sdcodex:
    build: .
    image: nakedzombie/sdcodex:latest
    container_name: sdcodex
    restart: unless-stopped
    ports:
      - "${SDCODEX_PORT:-5001}:5001"
    environment:
      PORT: "5001"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "sqlite:////data/db/sdcodex.db"
      PUID: "${PUID:-${UID:-1000}}"
      PGID: "${PGID:-${GID:-${GUID:-1000}}}"
      UMASK: "${UMASK:-002}"
      PLUGINS_DIR: /app/plugins
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    entrypoint: ["/entrypoint.sh"]
    volumes:
      # Core volume mounts
      - ${DB:-./db}:/data/db
      - ./app:/app/app
      - ./run.py:/app/run.py
      - ./Dockerfile:/app/Dockerfile:ro
      - ${MODELS:-./app/static/downloads}:/app/app/static/downloads
      - ./plugins:/app/plugins
      - ./entrypoint.sh:/entrypoint.sh:ro
      # Host Docker socket — required for the in-UI self-update feature
      # (Settings > System & Update > Self-update). Read-write access is needed
      # for the app to pre-create a replacement container and launch the updater
      # sidecar that swaps this container. If you do NOT want the app to have
      # host Docker access, delete this line — the Self-update card will then
      # report "socket: missing/ro" and stay disabled (everything else works).
      - /var/run/docker.sock:/var/run/docker.sock
      # --- PLUGIN CONFIG MOUNTS
      - ./docker-compose.override.yml:/app/docker-compose.override.yml
      - ./.env:/app/.env
      - ./requirements.txt:/app/requirements.txt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:${PORT:-5001}/healthz', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
