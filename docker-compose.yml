# SDCodex — Docker Compose (Modular Plugin Architecture)
#
# Core SDCodex provides Home, Models, and Library.
# Additional capabilities (Captioning/Gallery/ComfyUI, GalleryDL, RemBG)
# are installed as plugins via Settings -> Plugins.
#
# Installing a plugin updates the volume mounts below, requirements.txt, and .env.
# After installing or reconfiguring a plugin, restart with:
#   docker compose up -d

services:
  sdcodex:
    build: .
    image: nakedzombie/sdcodex:latest
    container_name: sdcodex
    restart: unless-stopped
    ports:
      - "${SDCODEX_PORT:-5001}:5001"
    environment:
      # --- PLUGIN ENV START ---
      # [gallery-dl]
      TASKS: "/data/tasks"
      CONFIG: "/data/config"
      IMAGES: "/data/downloads"
      # [comfy-caption]
      GALLERY: "/app/app/static/saved_gallery"
      COMFYUI_CUSTOM_NODES: "/data/custom_nodes"
      # [rembg]
      HFH: "/data/huggingface"
      REMBG_OUTPUT: "/data/rembg_output"
      # --- PLUGIN ENV END ---
      PORT: "5001"
      SECRET_KEY: "${SECRET_KEY:-}"
      DATABASE_URL: "sqlite:////data/db/sdcodex.db"
      PUID: "${PUID:-${UID:-1000}}"
      PGID: "${PGID:-${GID:-${GUID:-1000}}}"
      UMASK: "${UMASK:-002}"
      PLUGINS_DIR: /app/plugins
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    entrypoint: ["/entrypoint.sh"]
    volumes:
      # Core volume mounts
      - ${DB:-./db}:/data/db
      - ./app:/app/app
      - ./run.py:/app/run.py
      - ${MODELS:-./app/static/downloads}:/app/app/static/downloads
      - ./plugins:/app/plugins
      - ./entrypoint.sh:/entrypoint.sh:ro

      # --- PLUGIN CONFIG MOUNTS
      - ./docker-compose.yml:/app/docker-compose.yml
      - ./.env:/app/.env
      - ./requirements.txt:/app/requirements.txt
      # --- PLUGIN VOLUMES START ---
      # (Installed plugin volume mounts are appended here by Settings -> Plugins)
      # [gallery-dl]
      - ${TASKS:-./tasks}:/data/tasks
      - ${CONFIG:-./config}:/data/config
      - ${IMAGES:-./downloads}:/data/downloads
      # [comfy-caption]
      - ${GALLERY:-.gallery}:/app/app/static/saved_gallery
      - ${COMFYUI_CUSTOM_NODES:-./comfyui/custom_nodes}:/data/custom_nodes
      # [rembg]
      - ${HFH:-./Huggingface}:/data/huggingface
      - ${REMBG_OUTPUT:-./rembg_output}:/data/rembg_output
      # --- PLUGIN VOLUMES END ---

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:${PORT:-5001}/healthz', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
